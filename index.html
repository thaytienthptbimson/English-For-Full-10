<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiếng Anh lớp 10 – Global Success</title>
<style>
:root{--ink:#16313b;--mut:#5f7a84;--bg:#fdf1ef;--teal:#c0392b;--sun:#ffc83d;--coral:#ff6a5b;--sky:#dff1fb;--line:#f2d8d3}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:2.5rem}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #1b6ef3;outline-offset:2px}
header{background:var(--teal);color:#fff;padding:1.375rem 1rem 3.625rem;text-align:center}
header h1{margin:0;font-size:1.75rem}
header p{margin:0.25rem 0 0;opacity:.9}
#stat{display:inline-block;margin-top:0.625rem;background:rgba(255,255,255,.22);padding:0.25rem 0.875rem;border-radius:6.1875rem;font-weight:700;font-size:0.875rem}
main{max-width:35rem;margin:.75rem auto 0;padding:0 0.875rem}

#utitle{font-weight:800;font-size:1.125rem;margin:0 0.25rem 0.625rem}
#utitle small{display:block;color:var(--mut);font-weight:600;font-size:0.875rem}
#tabs{display:flex;background:#fff;border-radius:0.875rem;padding:0.25rem;gap:0.25rem;border:2px solid var(--line)}
#tabs button{flex:1;border:0;background:none;padding:0.5625rem 2px;border-radius:0.625rem;font-weight:700;font-size:0.875rem;color:var(--mut);cursor:pointer}
#tabs button.on{background:var(--teal);color:#fff}
.card{background:#fff;border-radius:1.5rem;padding:1.25rem 1.125rem 1.125rem;margin-top:0.75rem;text-align:center;border:2px solid var(--line);box-shadow:0 0.375rem 0 var(--line)}
.bar{height:0.5rem;background:var(--line);border-radius:0.5625rem;overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--coral);transition:width .3s}
#emoji{font-size:5.75rem;line-height:1.2;margin-top:0.75rem}
#tag{display:inline-block;padding:3px 0.75rem;border-radius:6.1875rem;font-size:0.8125rem;font-weight:800}
.t1{background:#fadbd6;color:#8a1f14}.t2{background:#fff0c2;color:#7a5600}.t3{background:var(--sky);color:#1f5f86}
#w{font-size:2.5rem;margin:0.5rem 0 2px;line-height:1.15;word-break:break-word}
#ipa{font:1.375rem "Times New Roman",serif;color:var(--coral);min-height:1.75rem}
#vn{font-size:1.3125rem;color:var(--mut);margin:0.25rem 0 0.625rem;font-weight:700}
#res{min-height:1.5rem;font-weight:800;margin:0.375rem 0}
.ok{color:#118a4e}.no{color:#c0392b}
.row{display:flex;gap:0.5rem;margin-top:0.5rem}
.row button,.big{flex:1;padding:0.8125rem 0.375rem;border:0;border-radius:0.875rem;font-weight:800;font-size:1rem;color:#fff;cursor:pointer;box-shadow:0 0.25rem 0 rgba(0,0,0,.18)}
.row button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.b1{background:#27ae60}.b2{background:#2d7fd3}.b3{background:#7c4dbb}.b4{background:#8a9aa0}
#know.done{background:var(--sun);color:#5a4200}
#cnt{color:var(--mut);font-size:0.875rem;margin:0.75rem 0 0}
.pop{animation:pop .22s}
@keyframes pop{from{transform:scale(.97)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}#fill{transition:none}}
#tg{width:100%;margin-top:1rem;background:var(--ink);padding:0.75rem}
#teach{display:none;background:#fff8dc;border:2px solid #f3dd8b;border-radius:1.125rem;padding:1rem;margin-top:0.625rem}
#teach h3{margin:0 0 0.625rem;text-align:center}
input{width:100%;padding:0.625rem;font-size:0.9375rem;border:2px solid var(--line);border-radius:0.625rem;margin-bottom:0.5rem}
.add{background:#e67e22;width:100%}
#msg{color:#118a4e;font-weight:700;text-align:center;margin:0.5rem 0 0;min-height:1.25rem}
#note{text-align:center;color:#b05a12;font-weight:700;font-size:0.875rem;margin-top:0.875rem}
#lock{display:none;position:fixed;inset:0;background:rgba(10,30,36,.6);justify-content:center;align-items:flex-start;padding:3.75rem 1.125rem;z-index:9}
.lc{background:#fff;border-radius:1.375rem;padding:1.625rem;max-width:26.25rem;width:100%;text-align:center;border-top:0.375rem solid var(--coral)}
.lc h2{margin:0 0 0.5rem}
#err{color:#c0392b;font-weight:700;min-height:1.25rem}

html{-webkit-text-size-adjust:100%;font-size:calc(clamp(15px,min(.8vw + 13px,2.2vh + 8px),30px)*var(--z,1))}
#zoom{display:inline-flex;align-items:center;gap:.25rem;background:rgba(255,255,255,.22);border-radius:6rem;padding:.2rem;margin-bottom:.6rem}
#zoom button{border:0;border-radius:6rem;min-width:2.75rem;height:2.5rem;background:#fff;color:var(--teal);font-weight:800;font-size:1rem;cursor:pointer}
#zoom #zv{background:none;color:#fff;min-width:3.6rem}
#tabs{flex-wrap:wrap}
main{max-width:64rem}
#app{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:1rem;align-items:start}
#pane{max-width:40rem;width:100%;margin:0 auto}
#units{background:#fff;border:2px solid var(--line);border-radius:1.25rem;padding:.5rem;display:flex;flex-direction:column;gap:.35rem;position:sticky;top:.75rem;max-height:calc(100vh - 1.5rem);overflow-y:auto}
#units::before{content:"📚 Danh sách bài học";font-weight:800;color:var(--mut);padding:.4rem .6rem;font-size:.9rem}
#units button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;padding:.5rem .6rem;border:2px solid transparent;border-radius:.9rem;background:#fff;color:var(--ink);cursor:pointer;position:relative}
#units button:hover{background:var(--bg)}
#units button.on{background:var(--sun);border-color:var(--sun)}
#units b{flex:none;width:2rem;height:2rem;border-radius:.6rem;background:var(--bg);display:grid;place-items:center}
#units .on b{background:#fff}
#units span{flex:1;min-width:0;line-height:1.25}
#units strong{display:block;font-size:.95rem}
#units small{color:var(--mut);font-weight:700;font-size:.8rem}
#units .on small{color:#5a4200}
#units i{font-style:normal;font-size:1.3rem}
#units .lk::after{content:"🔒";font-size:.8rem}
.nw main{max-width:36rem}
.nw #app{display:block}
.nw #units{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding:.45rem;margin-bottom:.6rem}
.nw #units::before{display:none}
.nw #units button{flex:none;width:auto;padding:.3rem}
.nw #units span,.nw #units i{display:none}
.nw #units b{width:2.4rem;height:2.4rem}
.nw #units .lk::after{position:absolute;right:-.25rem;top:-.4rem}
#tabs button{flex:1 1 auto}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.3rem .6rem;padding:.4rem .9rem}
header h1{font-size:1.1rem;flex:1;text-align:left;white-space:nowrap}
#stat{margin:0;padding:.15rem .7rem;font-size:.8rem}
#zoom{margin:0;padding:.15rem;gap:.15rem}
#zoom button{min-width:2.4rem;height:2.1rem;font-size:.9rem}
#zoom #zv{min-width:2.9rem}

#mode{display:flex;gap:.25rem;margin-bottom:.5rem;background:#fff;border:2px solid var(--line);border-radius:.875rem;padding:.25rem}
#mode button{flex:1;border:0;background:none;padding:.55rem;border-radius:.625rem;font-weight:800;color:var(--mut);cursor:pointer;font-size:.95rem}
#mode button.on{background:var(--ink);color:#fff}
#pcard{text-align:left}
#pcard h3{margin:.2rem 0 .5rem;text-align:center}
.pbf{display:block;height:100%;background:var(--coral);transition:width .3s}
.lvb{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;padding:.7rem;margin-top:.5rem;border:2px solid var(--line);border-radius:1rem;background:#fff;color:var(--ink);cursor:pointer;font-size:.95rem}
.lvb:hover{border-color:var(--coral);background:var(--bg)}
.lvb i{font-style:normal;font-size:1.7rem}
.lvb span{flex:1;min-width:0}
.lvb small{display:block;color:var(--mut);font-weight:600}
.lvb em{font-style:normal;font-weight:800;color:#118a4e;white-space:nowrap}
.qi{color:var(--mut);font-weight:800;font-size:.85rem;margin:.6rem 0 .2rem}
.qp{font-size:1.35rem;font-weight:800;text-align:center;margin:.5rem 0 .8rem;line-height:1.4;word-break:break-word}
.qp small{display:block;font-size:.95rem;color:var(--mut);font-weight:700;margin-top:.3rem}
.op{display:block;width:100%;text-align:left;margin-top:.45rem;padding:.7rem .8rem;border:2px solid var(--line);border-radius:.9rem;background:#fff;color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer}
.op:hover{border-color:var(--coral)}
.op.ok{background:#d9f5e5;border-color:#27ae60}
.op.no{background:#fde0dc;border-color:#c0392b}
.az{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;min-height:3rem;padding:.5rem;border-radius:.9rem}
#paz{border:2px dashed var(--line);margin-bottom:.6rem}
.tk{border:2px solid var(--line);background:#fff;border-radius:.7rem;padding:.45rem .7rem;font-weight:800;font-size:1.05rem;color:var(--ink);cursor:pointer;box-shadow:0 .2rem 0 var(--line)}
.tk:disabled{opacity:.3;box-shadow:none}
#pcard.d .op,#pcard.d #paz .tk,#pcard.d #pbk .tk{pointer-events:none}
#pf{min-height:1.5rem;font-weight:800;margin:.6rem 0 0;text-align:center}
.pb{display:flex;gap:.5rem;margin-top:.6rem}
.wr{padding:.4rem .6rem;margin-top:.35rem;border-left:4px solid var(--coral);background:var(--bg);border-radius:.5rem;font-weight:700;font-size:.9rem}
#mode button{font-size:.85rem;padding:.55rem .15rem}
#xcard{text-align:left}#xcard h3{margin:.2rem 0 .5rem;text-align:center}
#xcard.d .op,#xcard.d .tk{pointer-events:none}
#mode{flex-wrap:wrap}#mode button{min-width:5.2rem}
.ps{background:var(--bg);border-radius:.8rem;padding:.6rem;margin:.4rem 0;font-weight:600;line-height:1.5;font-size:.95rem}
.rl{background:#fff8dc;border:2px solid #f3dd8b;border-radius:1rem;padding:.7rem;font-weight:700;font-size:.92rem;line-height:1.5;margin-bottom:.4rem}
.op.sel{background:var(--sky);border-color:#2d7fd3}.op:disabled{cursor:default}
#xcard .eg{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}#xcard .eg .op{text-align:center;font-size:2rem;padding:.4rem 0;margin-top:0}
#xcard .gp{line-height:2.4}#xcard .gp input{display:inline-block;width:8.5rem;margin:0 .15rem;padding:.2rem .4rem;font-size:1rem;text-align:center}
</style>
</head>
<body>
<header><h1>🌟 Tiếng Anh lớp 10</h1><div id="stat"></div><div id="zoom"><button id="zm" aria-label="Thu nhỏ chữ">A−</button><button id="zv" aria-label="Về cỡ mặc định">100%</button><button id="zp" aria-label="Phóng to chữ">A+</button></div></header>
<main><div id="app">
<nav id="units" aria-label="Danh sách bài học"></nav>
<div id="pane">
<div id="utitle"></div>
<div id="mode"><button data-m="0" class="on">🃏 Thẻ học</button><button data-m="1">✍️ Luyện tập</button><button data-m="2">📘 Ngữ pháp</button><button data-m="3">🎧 Luyện nghe</button><button data-m="4">📝 Kiểm tra</button></div>
<div id="tabs">
<button data-t="0" class="on">Tất cả</button><button data-t="1">Từ chính</button><button data-t="2">Mở rộng</button><button data-t="3">Mẫu câu</button>
</div>
<section class="card" id="card">
<div class="bar"><i id="fill"></i></div>
<div id="emoji"></div><span id="tag"></span>
<h2 id="w"></h2><div id="ipa"></div><div id="vn"></div>
<p id="res" aria-live="polite"></p>
<div class="row"><button class="b1" id="bl">🔊 Nghe</button><button class="b2" id="bs">🎙 Đọc</button></div>
<div class="row"><button class="b4" id="bp" aria-label="Từ trước">◀</button><button class="b3" id="know">⭐ Đã thuộc</button><button class="b4" id="bn" aria-label="Từ sau">▶</button></div>
<p id="cnt"></p>
</section>
<section class="card" id="pcard" style="display:none"></section>
<section class="card" id="xcard" style="display:none"></section>
<button class="big" id="tg">👨‍🏫 Chế độ giáo viên (thêm từ)</button>
<div id="teach">
<h3>Thêm từ vào Unit đang chọn</h3>
<input id="nw" placeholder="Từ tiếng Anh"><input id="ni" placeholder="Phiên âm IPA (không bắt buộc)"><input id="nm" placeholder="Nghĩa tiếng Việt">
<button class="big add" id="ba">➕ Lưu từ</button><p id="msg"></p>
</div>
<p id="note"></p>
</div></div>
</main>
<div id="lock"><div class="lc">
<h2>🔒 Unit đã khóa</h2>
<p style="color:#5f7a84">Unit 1 dùng thử miễn phí. Nhập mật khẩu để mở Unit 2 – 10.</p>
<input type="password" id="pw" placeholder="Nhập mật khẩu bản quyền...">
<button class="big b1" id="bk" style="width:100%;margin-bottom:.5rem">🔓 Mở khóa</button>
<button class="big b4" id="bx" style="width:100%">Để sau</button>
<p id="err"></p>
</div></div>
<script>
const FREE=1,$=id=>document.getElementById(id);
// Dữ liệu Tiếng Anh lớp 10 - Global Success mở rộng
const D=[
  ["Family Life", "Cuộc sống gia đình", "👨‍👩‍👧", "🏠|homemaker|ˈhəʊmmeɪkə|người nội trợ;🍞|breadwinner|ˈbredwɪnə|người trụ cột gia đình;🛒|groceries|ˈɡrəʊsəriz|hàng tạp hóa;🍽️|chore|tʃɔː|việc vặt trong nhà;👔|heavy lifting|ˌhevi ˈlɪftɪŋ|việc nặng nhọc;🧺|laundry|ˈlɔːndri|việc giặt giũ;🤝|split|splɪt|chia sẻ;👨‍👩‍👧|routine|ruːˈtiːn|thói quen sinh hoạt;🗑️|rubbish|ˈrʌbɪʃ|rác thải;🧹|sweep|swiːp|quét dọn;👕|iron|ˈaɪən|ủi, là quần áo;🍲|cook|kʊk|nấu ăn;💰|finance|ˈfaɪnæns|tài chính;💕|bond|bɒnd|sự gắn kết;🙏|gratitude|ˈɡrætɪtjuːd|lòng biết ơn;💪|strengthen|ˈstreŋθn|làm mạnh mẽ", "🤝|share|ʃeə|chia sẻ;👨‍👩‍👦|responsibility|rɪˌspɒnsəˈbɪləti|trách nhiệm;🛠️|manage|ˈmænɪdʒ|quản lý;🧠|character|ˈkærəktə|tính cách;✅|benefit|ˈbenɪfɪt|lợi ích;🏃|life skill|laɪf skɪl|kỹ năng sống;📋|duty|ˈdjuːti|nhiệm vụ;🤗|supportive|səˈpɔːtɪv|ủng hộ, giúp đỡ;🤝|sociable|ˈsəʊʃəbl|hòa đồng;💖|respect|rɪˈspekt|tôn trọng", "💬|My mother is a homemaker and my father is the breadwinner.||Mẹ tớ là người nội trợ còn bố tớ là trụ cột gia đình.;💬|We usually split the household chores equally.||Chúng tớ thường chia đều việc nhà.;💬|Doing chores helps children learn important life skills.||Làm việc nhà giúp trẻ học những kỹ năng sống quan trọng.;💬|Family routines strengthen the family bonds.||Các thói quen sinh hoạt gia đình củng cố sự gắn kết gia đình.;💬|I always show gratitude to my parents for their hard work.||Tớ luôn thể hiện lòng biết ơn tới bố mẹ vì sự vất vả của họ."],
  ["Humans and the Environment", "Con người và Môi trường", "🌍", "🌍|environment|ɪnˈvaɪrənmənt|môi trường;👣|carbon footprint|ˌkɑːbən ˈfʊtprɪnt|dấu chân carbon;♻️|eco-friendly|ˌiːkəʊ ˈfrendli|thân thiện với môi trường;🚮|litter|ˈlɪtə|vứt rác bừa bãi;🌱|adopt|əˈdɒpt|áp dụng, nhận nuôi;💡|appliance|əˈplaɪəns|thiết bị;🔋|energy|ˈenədʒi|năng lượng;📉|reduce|rɪˈdjuːs|giảm thiểu;🌡️|global warming|ˈɡləʊbl ˈwɔːmɪŋ|sự nóng lên toàn cầu;💨|emission|ɪˈmɪʃn|khí thải;♻️|sustainable|səˈsteɪnəbl|bền vững;📦|packaging|ˈpækɪdʒɪŋ|bao bì;🛍️|single-use|ˌsɪŋɡl ˈjuːs|dùng một lần;🗑️|sort|sɔːt|phân loại;⚠️|consequence|ˈkɒnsɪkwəns|hậu quả", "🌤️|climate change|ˈklaɪmət tʃeɪndʒ|biến đổi khí hậu;♻️|reusable|riːˈjuːzəbl|có thể tái sử dụng;🪵|raw material|rɔː məˈtɪəriəl|nguyên liệu thô;🌿|organic|ɔːˈɡænɪk|hữu cơ;🔌|alternative|ɔːlˈtɜːnətɪv|sự thay thế;🛡️|protect|prəˈtekt|bảo vệ;🌍|awareness|əˈweənəs|sự nhận thức;🏭|greenhouse gas|ˈɡriːnhaʊs ɡæs|khí nhà kính;🌫️|ozone layer|ˈəʊzəʊn ˈleɪə|tầng ô-zôn;🌳|plant|plɑːnt|trồng cây", "💬|We should adopt a greener lifestyle to protect the environment.||Chúng ta nên áp dụng lối sống xanh hơn để bảo vệ môi trường.;💬|Reducing our carbon footprint is very important.||Việc giảm thiểu dấu chân carbon là rất quan trọng.;💬|Single-use plastic bags are bad for the environment.||Túi nilon dùng một lần rất có hại cho môi trường.;💬|Remember to sort your rubbish for recycling.||Hãy nhớ phân loại rác để tái chế.;💬|Global warming is causing serious consequences.||Sự nóng lên toàn cầu đang gây ra những hậu quả nghiêm trọng."],

const GB=[
["Present simple vs present continuous","Hiện tại đơn (V-s/es): thói quen, sự thật. Hiện tại tiếp diễn (am/is/are + V-ing): đang xảy ra (now, Look!). Động từ trạng thái (own, know, like) không dùng tiếp diễn.",["My mother ___ dinner in the kitchen right now.|is cooking|cooks/cook/is cook|Có 'right now' → hiện tại tiếp diễn.","She usually ___ the laundry on Sundays.|does|is doing/do/did|'usually' → thói quen, hiện tại đơn.","Water ___ at 100 degrees Celsius.|boils|is boiling/boil/boiled|Sự thật hiển nhiên → hiện tại đơn.","Look! The children ___ the housework together.|are doing|do/does/is doing|'Look!' → hành động đang diễn ra.","I ___ this house. It belongs to my uncle.|don't own|am not owning/doesn't own/didn't own|'own' là động từ trạng thái, không dùng tiếp diễn.","R|Viết câu phủ định: My father cooks dinner every day.|my father doesn't cook dinner every day~my father does not cook dinner every day|Phủ định hiện tại đơn: does not + V."]],
["will vs be going to; Passive voice","will: quyết định tại lúc nói, dự đoán chủ quan. be going to: kế hoạch, dự đoán có bằng chứng. Bị động: be + V3/ed (am/is/are, was/were, will be).",["A: The phone is ringing. B: I ___ answer it.|will|am going to/would/am|Quyết định tức thời → will.","Look at those dark clouds! It ___ rain.|is going to|will/is/does|Dự đoán có bằng chứng → be going to.","Plastic bags ___ in many supermarkets nowadays.|are banned|ban/are banning/is banned|Bị động hiện tại đơn, chủ ngữ số nhiều.","The river ___ by the factory last year.|was polluted|polluted/is polluted/were polluted|Bị động quá khứ đơn.","Many trees ___ in our school next month.|will be planted|will plant/are planted/will be planting|Bị động tương lai đơn: will be + V3.","R|Viết lại câu bị động: People recycle paper in this city.|paper is recycled in this city~paper is recycled in this city by people|Bị động hiện tại đơn: is/are + V3."]],
["Compound sentences; to-infinitive & bare infinitive","Câu ghép nối bằng for, and, nor, but, or, yet, so. want/decide/hope... + to V; let/make + O + V; see/hear + O + V (nghe/thấy trọn hành động).",["I love jazz, ___ my brother prefers rock.|but|so/or/because|Hai ý tương phản → but.","She wanted to become a singer, ___ she practised every day.|so|but/or/although|Chỉ kết quả → so.","He decided ___ a new guitar.|to buy|buy/buying/bought|decide + to V.","My parents let me ___ to the concert tonight.|go|to go/going/went|let + O + V (không 'to').","We heard the band ___ my favourite song.|play|to play/played/to playing|hear + O + V: nghe trọn bài hát.","R|Nối bằng 'so': He has a beautiful voice. Many people love his songs.|he has a beautiful voice so many people love his songs|He has..., so + mệnh đề chỉ kết quả."]],
["Past simple vs past continuous (when / while)","when + quá khứ đơn (hành động xen vào), while + quá khứ tiếp diễn (hành động đang diễn ra). Hai hành động song song: while + quá khứ tiếp diễn.",["She ___ the charity last year.|joined|was joining/joins/has joined|'last year' → quá khứ đơn.","I ___ TV when the phone rang.|was watching|watched/am watching/watch|Hành động đang diễn ra bị xen vào → quá khứ tiếp diễn.","While we ___ at the orphanage, it started to rain.|were volunteering|volunteered/are volunteering/volunteer|while + quá khứ tiếp diễn.","When he arrived, we ___ the room.|were decorating|decorated/decorate/had decorating|Đang làm dở thì có người đến.","The volunteers ___ blankets at 9 a.m. yesterday.|were giving out|gave out/give out/have given out|Thời điểm xác định trong quá khứ → tiếp diễn.","R|Nối bằng 'while': I was cooking. My sister was cleaning the house.|while i was cooking my sister was cleaning the house~i was cooking while my sister was cleaning the house|Hai hành động song song: while + was/were + V-ing."]],
["Present perfect; gerunds & to-infinitives","Hiện tại hoàn thành: have/has + V3 (for, since, ever, never, yet, already). enjoy/avoid/finish + V-ing; want/hope/plan + to V.",["Have you ever ___ a robot?|seen|saw/see/sees|ever → hiện tại hoàn thành (V3).","I ___ this smartphone for two years.|have had|had/have/am having|'for two years' → hiện tại hoàn thành.","I want ___ more about AI.|to learn|learning/learn/learned|want + to V.","He enjoys ___ with new devices.|experimenting|to experiment/experiment/experimented|enjoy + V-ing.","They ___ the new software yet.|haven't installed|didn't install/don't install/hasn't installed|'yet' → hiện tại hoàn thành phủ định.","R|Viết lại với 'for': I started using this laptop three years ago.|i have used this laptop for three years~i have had this laptop for three years|Hiện tại hoàn thành + for + khoảng thời gian."]],

["Comparative and superlative adjectives","So sánh hơn: adj-er / more + adj + than. So sánh nhất: the adj-est / the most + adj. So sánh kép: the + so sánh hơn..., the + so sánh hơn. not as + adj + as.",["Ha Long Bay is ___ than Sa Pa for a beach holiday.|better|gooder/best/more good|good → better (bất quy tắc).","Hanoi is not as ___ as Tokyo.|big|bigger/biggest/the big|not as + adj gốc + as.","Viet Nam is one of ___ countries in ASEAN.|the most dynamic|more dynamic/most dynamic/the dynamic|one of + the + so sánh nhất.","Economic ties are becoming ___ every year.|more important|importanter/most important/the more important|Tính từ dài → more + adj.","The more we cooperate, ___ we will be.|the stronger|stronger/the strongest/strong|So sánh kép: the + so sánh hơn.","R|Viết lại với 'not as ... as': Viet Nam is smaller than China.|viet nam is not as big as china~viet nam is not as large as china|A smaller than B = A is not as big as B."]],
["Relative clauses (who, which, whose, that)","who: người; which: vật; that: người/vật (chỉ dùng trong mệnh đề xác định); whose + N: sở hữu. Mệnh đề không xác định có dấu phẩy, không dùng that.",["The teacher ___ teaches us online is very kind.|who|which/whose/where|Chỉ người, làm chủ ngữ → who.","This is the app ___ helps me learn vocabulary.|which|who/whose/where|Chỉ vật, làm chủ ngữ → which/that.","The student ___ laptop broke is using mine.|whose|who/which/that|whose + N chỉ sở hữu.","Duolingo, ___ is a popular app, has millions of users.|which|that/who/whom|Mệnh đề không xác định (có dấu phẩy) không dùng that.","The platform ___ we use for classes is easy to use.|that|who/whose/what|that thay cho vật trong mệnh đề xác định.","R|Nối bằng đại từ quan hệ: I have a friend. She studies online.|i have a friend who studies online~i have a friend that studies online|who thay cho she."]],
["Reported speech","Lùi thì: am/is → was/were, will → would, V-ed → had V3. Đổi đại từ và trạng từ (now → then, yesterday → the day before). Câu hỏi: ask + wh-/if + S + V. Mệnh lệnh: tell + O + (not) to V.",["She said, 'I am tired.' → She said that she ___ tired.|was|is/am/were|am → was khi lùi thì.","He said, 'I will help you.' → He said he ___ help me.|would|will/can/had|will → would.","'Where do you live?' he asked me. → He asked me where I ___.|lived|do live/am living/will live|Câu hỏi tường thuật: lùi thì, trật tự khẳng định.","'Don't be late,' the teacher said. → The teacher told us ___ late.|not to be|don't be/not be/to be not|tell + O + not to V.","'I visited Hue yesterday,' she said. → She said she ___ Hue the day before.|had visited|has visited/visits/will visit|Quá khứ đơn → quá khứ hoàn thành.","R|Tường thuật: 'I am studying English now,' Lan said.|lan said that she was studying english then~lan said she was studying english then~lan said that she was studying english at that time~lan said she was studying english at that time|am studying → was studying; now → then."]],
["Conditional sentences type 1 and 2","Loại 1 (có thật): If + hiện tại đơn, will + V. Loại 2 (không có thật ở hiện tại): If + quá khứ đơn (be → were), would + V.",["If it ___ tomorrow, we will cancel the trip.|rains|will rain/rained/would rain|Loại 1: If + hiện tại đơn.","If tourists litter, the beach ___ dirty.|will become|would become/became/is becoming|Loại 1: mệnh đề chính dùng will + V.","If we ___ more trees, the air would be cleaner.|planted|plant/will plant/would plant|Loại 2: If + quá khứ đơn.","If I ___ a bird, I would fly over the mountains.|were|am/will be/had been|Loại 2: dùng were cho mọi chủ ngữ.","What would you do if you ___ a national park manager?|were|are/will be/would be|Loại 2: If + were.","R|Viết lại với If: Stop littering or the forest will be damaged.|if you don't stop littering the forest will be damaged~if we don't stop littering the forest will be damaged|or = nếu không → If + phủ định, will + V."]]
